# Mission Control: harness + UI. Inference runs on native Windows Ollama
# (GPU, port 11435), reached from containers via host.docker.internal.
#   docker compose up -d     then open http://localhost:5173
name: mission-control

services:
  harness:
    image: node:22-bookworm-slim
    working_dir: /app
    user: "1000:1000"
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      HOME: /tmp
      HOST: 0.0.0.0
      PORT: 3008
      OLLAMA_BASE_URL: http://host.docker.internal:11435
      OLLAMA_MODEL: qwen3:14b
      OLLAMA_NUM_CTX: 8192
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # HQ: routing/memory model, saved hive + memories, Telegram (token from .env)
      OLLAMA_FAST_MODEL: ${OLLAMA_FAST_MODEL:-qwen3:14b}
      DATA_DIR: /app/data
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      # Uncomment with the vault volume below
      # OBSIDIAN_VAULT: /vault
      # Real browsing for the browser agent (live view in the dashboard's Browser tab)
      BROWSER_CDP_URL: http://browser:9222
      BROWSER_MAX_STEPS: ${BROWSER_MAX_STEPS:-10}
      # Videos: the Remotion service below
      VIDEO_RENDER_URL: http://video:3020
      # Voiceovers and word-timed captions: the voice service below
      VOICE_URL: http://voice:3030
    volumes:
      - .:/app
      # - /mnt/c/Users/aldra/Documents/ObsidianVault:/vault
    # Published on localhost only; port 3008 is taken by jarvis-harness
    ports:
      - "127.0.0.1:3010:3008"
    networks: [default, render]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3008/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # Headless Chrome for the browser agent. Not published to your machine: only
  # the harness can reach it. The harness blocks pages from loading anything on
  # localhost or your LAN.
  browser:
    image: chromedp/headless-shell:latest
    shm_size: 1gb
    restart: unless-stopped

  # Remotion: renders the videos the Coder writes. Built once with internet
  # (downloads Remotion and its Chrome, about 1 GB); at runtime it's on a private
  # network with no internet, sees none of your files or keys, and only the
  # harness can reach it.
  video:
    build: ./video
    shm_size: 2gb
    environment:
      VIDEO_MAX_SECONDS: ${VIDEO_MAX_SECONDS:-60}
      # Chrome tabs rendering frames in parallel; blank lets Remotion choose
      VIDEO_CONCURRENCY: ${VIDEO_CONCURRENCY:-}
    networks: [render]
    restart: unless-stopped

  # Voiceovers (Kokoro) and word timings for captions (faster-whisper), on the CPU.
  # Built once with internet (downloads the models, about 1 GB); at runtime it's on
  # the same private network as the video service: no internet, none of your files.
  voice:
    build:
      context: ./voice
      args:
        # base.en is quick on a CPU; small.en times words more accurately
        WHISPER_MODEL: ${VOICE_WHISPER_MODEL:-base.en}
    environment:
      VOICE_DEFAULT: ${VOICE_DEFAULT:-af_heart}
    networks: [render]
    restart: unless-stopped

  ui:
    image: node:22-bookworm-slim
    working_dir: /app/ui
    user: "1000:1000"
    command: sh -c "npm install --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5173"
    environment:
      HOME: /tmp
      VITE_HARNESS_URL: http://localhost:3010
      VITE_POLL: "true"
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      harness:
        condition: service_healthy
    restart: unless-stopped

networks:
  default: {}
  # Private: the harness, the video service and the voice service only, no internet
  render:
    internal: true
