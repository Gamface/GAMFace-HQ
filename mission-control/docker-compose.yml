# Mission Control: harness + UI + brain database. Inference runs on native
# Windows Ollama (GPU, port 11435), reached from containers via host.docker.internal.
#   docker compose up -d     then open http://localhost:5173
#   docker compose --profile viewer up -d   also starts NocoDB (http://localhost:8081)
name: mission-control

services:
  harness:
    image: node:22-bookworm-slim
    working_dir: /app
    user: "1000:1000"
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      HOME: /tmp
      HOST: 0.0.0.0
      PORT: 3008
      OLLAMA_BASE_URL: http://host.docker.internal:11435
      OLLAMA_MODEL: qwen3:14b
      OLLAMA_NUM_CTX: 8192
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # HQ: routing/memory model, saved hive + memories, Telegram (token from .env)
      OLLAMA_FAST_MODEL: ${OLLAMA_FAST_MODEL:-qwen3:14b}
      DATA_DIR: /app/data
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      # Your Obsidian vault (mounted below)
      OBSIDIAN_VAULT: /vault
      # Real browsing for the browser agent (live view in the dashboard's Browser tab)
      BROWSER_CDP_URL: http://browser:9222
      BROWSER_MAX_STEPS: ${BROWSER_MAX_STEPS:-10}
      # Videos: the Remotion service below
      VIDEO_RENDER_URL: http://video:3020
      # Your graphics card's memory in GB, for the dashboard's VRAM bar
      GPU_VRAM_GB: ${GPU_VRAM_GB:-16}
      # Voiceovers and word-timed captions: the voice service below
      VOICE_URL: http://voice:3030
      # The music studio below (songs, stems, practice, karaoke, sheet music)
      STUDIO_URL: http://studio:3050
      # Recordings are transcribed by Whisper in the voice service; "model" uses the Transcriber
      TRANSCRIBE_WITH: ${TRANSCRIBE_WITH:-whisper}
      # Tools (MCP servers) the agents may use: the tools service below
      TOOLS_URL: http://tools:3040
      # Folders the Coder and File agents may edit (one per project; data/workspaces by
      # default). To let them work on your own repos, mount the folder that holds them
      # (the volume line below) and uncomment this:
      # WORKSPACES_DIR: /workspaces
      # Brain: shared memory + canon in Postgres, served to outside clients at /mcp
      DATABASE_URL: postgres://agentos:${BRAIN_DB_PASSWORD:?Set BRAIN_DB_PASSWORD in .env (openssl rand -hex 32)}@brain-db:5432/agent_brain
      BRAIN_PUBLIC_URL: http://localhost:3010/mcp
    depends_on:
      brain-db:
        condition: service_healthy
    volumes:
      - .:/app
      - /mnt/c/Users/aldra/Documents/ObsidianVault:/vault
      # - ~/code:/workspaces
    # Published on localhost only; port 3008 is taken by jarvis-harness
    ports:
      - "127.0.0.1:3010:3008"
    networks: [default, render, tools]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3008/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # The brain's database (Postgres + pgvector). Not published: only the harness
  # (and NocoDB, if started) can reach it. brain/db/schema.sql loads on first start;
  # later changes come from brain/db/migrations, applied when the harness starts.
  brain-db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: ${BRAIN_DB_PASSWORD:?Set BRAIN_DB_PASSWORD in .env (openssl rand -hex 32)}
      POSTGRES_DB: agent_brain
      NOCODB_META_PASSWORD: ${NOCODB_META_PASSWORD:-}
      NOCODB_RO_PASSWORD: ${NOCODB_RO_PASSWORD:-}
    volumes:
      - brain_pgdata:/var/lib/postgresql/data
      - ./brain/db/00-init-roles.sh:/docker-entrypoint-initdb.d/00-init-roles.sh:ro
      - ./brain/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agent_brain"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Optional read-only viewer for the brain (docker compose --profile viewer up -d).
  # After the first login, add a PostgreSQL data source: host brain-db, database
  # agent_brain, user nocodb_ro, password NOCODB_RO_PASSWORD.
  nocodb:
    profiles: ["viewer"]
    image: nocodb/nocodb:2026.08.0
    environment:
      NC_DB: "pg://brain-db:5432?u=nocodb_meta&p=${NOCODB_META_PASSWORD:-}&d=nocodb_meta"
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET:-}
      NC_DISABLE_TELE: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - nocodb_data:/usr/app/data
    depends_on:
      brain-db:
        condition: service_healthy
    restart: unless-stopped

  # Headless Chrome for the browser agent. Not published to your machine: only
  # the harness can reach it. The harness blocks pages from loading anything on
  # localhost or your LAN.
  browser:
    image: chromedp/headless-shell:latest
    shm_size: 1gb
    restart: unless-stopped

  # Remotion: renders the videos the Coder writes. Built once with internet
  # (downloads Remotion and its Chrome, about 1 GB); at runtime it's on a private
  # network with no internet, sees none of your files or keys, and only the
  # harness can reach it.
  video:
    build: ./video
    shm_size: 2gb
    environment:
      VIDEO_MAX_SECONDS: ${VIDEO_MAX_SECONDS:-60}
      # Chrome tabs rendering frames in parallel; blank lets Remotion choose
      VIDEO_CONCURRENCY: ${VIDEO_CONCURRENCY:-}
      # The port Remotion serves bundles on inside the container (its default, 3000, is avoided)
      VIDEO_BUNDLE_PORT: ${VIDEO_BUNDLE_PORT:-3100}
    networks: [render]
    restart: unless-stopped

  # Voiceovers (Kokoro) and word timings for captions (faster-whisper), on the CPU.
  # Built once with internet (downloads the models, about 1 GB); at runtime it's on
  # the same private network as the video service: no internet, none of your files.
  voice:
    build:
      context: ./voice
      args:
        # base.en is quick on a CPU; small.en times words more accurately
        WHISPER_MODEL: ${VOICE_WHISPER_MODEL:-base.en}
    environment:
      VOICE_DEFAULT: ${VOICE_DEFAULT:-af_heart}
    networks: [render]
    restart: unless-stopped

  # The music studio: songs (ACE-Step 1.5) and stem splitting run on the graphics card through
  # ComfyUI on Windows; practice tracks, karaoke, sheet music and DAW exports run here on the
  # CPU. Built once with internet (about 2 GB). Only the harness talks to it; it reaches
  # ComfyUI on the PC (host.docker.internal:8188) and the voice service for lyrics. Its
  # songs and outputs are in data/studio.
  studio:
    build: ./studio
    environment:
      COMFY_URL: ${COMFY_URL:-http://host.docker.internal:8188}
      VOICE_URL: http://voice:3030
      # Free stock photos and clips for themed music videos (pexels.com/api, pixabay.com/api/docs)
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/studio:/data
    networks: [render, studio-out]
    restart: unless-stopped

  # Tools for the agents: the MCP servers listed in tools/tools.json. Its own networks:
  # one to the harness only, one out to the internet for the tools. It sees none of
  # your files and none of Mission Control's keys; tool API keys go in tools/.env.
  tools:
    build: ./tools
    volumes:
      - ./tools/tools.json:/app/tools.json:ro
      # Mission Control's own committed code for the code tools (read-only; .env files and
      # data/ are git-ignored, so they aren't in it)
      - ../.git:/code.git:ro
    env_file:
      - path: ./tools/.env
        required: false
    networks: [tools, tools-out]
    restart: unless-stopped

  ui:
    image: node:22-bookworm-slim
    working_dir: /app/ui
    user: "1000:1000"
    command: sh -c "npm install --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5173"
    environment:
      HOME: /tmp
      VITE_HARNESS_URL: http://localhost:3010
      VITE_POLL: "true"
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      harness:
        condition: service_healthy
    restart: unless-stopped

networks:
  default: {}
  # Private: the harness, the video service and the voice service only, no internet
  render:
    internal: true
  # Private: the harness and the tools service only
  tools:
    internal: true
  # The tools service's way out to the internet (nothing else is on it)
  tools-out: {}
  # The studio's way to ComfyUI on the PC (host.docker.internal)
  studio-out: {}

volumes:
  brain_pgdata:
  nocodb_data:
